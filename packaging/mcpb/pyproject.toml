[project]
name = "marm-memory-mcpb"
version = "0.1.0"
description = "Locked runtime dependencies for the local MARM MCPB bundle"
requires-python = ">=3.10,<4"
dependencies = [
    "fastapi>=0.139.0",
    "fastapi-mcp>=0.4.0",
    "uvicorn>=0.51.0",
    "pydantic>=2.9.2",
    "fastembed>=0.8.0,<1.0.0",
    "numpy>=2.1.2",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10.4",
    "psutil>=6.1.0",
    "structlog>=24.4.0",
    "httpx>=0.28.1",
    "packaging>=24.0,<27.0",
    "mcp>=1.26.0,<2.0.0",
    "codebase-memory-mcp==0.10.5",
    "spacy>=3.8.0,<3.9.0",
    "watchdog>=4.0.0,<7.0.0",
    "websockets>=13.0",
    "pywinpty>=2.0.13; sys_platform == 'win32'",
]
