# Root-level so it covers marm-mcp-server/, scripts/, and marm-console/tests/ alike.

target-version = "py310"
line-length = 88

[lint]
select = ["E", "F", "B", "RUF", "W", "I", "C4", "ASYNC", "DTZ", "A"]
ignore = [
    "E501",    # ruff format handles what it can
    "RUF013",  # implicit Optional, pre-existing signatures
    "B905",    # zip() without strict=, pre-existing bench/test pattern
    "A002",    # type= is a published MCP/HTTP param name, not renameable
    "ASYNC230", # trio/anyio-only remedy, not worth a thread hop here
    "ASYNC240", # same
]

[lint.per-file-ignores]
"**/tests/**" = ["ASYNC110"]  # tests poll worker state by design

[format]
quote-style = "double"
indent-style = "space"
