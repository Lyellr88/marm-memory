changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix

  categories:
    - title: "Security"
      labels:
        - security

    - title: "Features"
      labels:
        - enhancement

    - title: "Fixes"
      labels:
        - bug

    - title: "Dependencies"
      labels:
        - dependencies

    - title: "Documentation"
      labels:
        - documentation

    - title: "CI and tooling"
      labels:
        - ci
        - workflow
        - chore

    - title: "Other"
      labels:
        - python
        - javascript
        - good first issue
        - help wanted
        - "*"
