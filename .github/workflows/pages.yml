name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [MARM-main]
    paths:
      - 'docs-site/**'
      - '*.md'
      - 'docs/*.md'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; skip queued runs but don't cancel in-progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site/docs _site/assets

          # Static site shell
          cp docs-site/index.html _site/
          cp docs-site/styles.css  _site/
          cp docs-site/app.js      _site/

          # Prevent Jekyll processing
          touch _site/.nojekyll

          # Root-level user-facing docs
          cp README.md       _site/
          cp CONTRIBUTING.md _site/
          cp CHANGELOG.md    _site/
          cp CONTRIBUTORS.md _site/
          cp SECURITY.md     _site/

          # docs/ user-facing docs (skip internal planning subdirs)
          cp docs/FAQ.md              _site/docs/
          cp docs/INSTALL-DOCKER.md   _site/docs/
          cp docs/INSTALL-WINDOWS.md  _site/docs/
          cp docs/INSTALL-LINUX.md    _site/docs/
          cp docs/INSTALL-PLATFORMS.md _site/docs/
          cp docs/PROTOCOL.md         _site/docs/
          cp docs/ROADMAP.md          _site/docs/

          # Brand assets (logo used in README and icons)
          cp -r assets/* _site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
