name: Ruff CI

on:
  push:
    branches: [ MARM-main ]
  pull_request:
    branches: [ MARM-main ]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned so a ruff release cannot turn a green PR red on its own. Unpinned,
      # 0.16.2 promoted RUF036 out of preview and failed a PR whose code had not
      # changed, while the developer's 0.15.16 reported the file clean.
      # Keep local ruff on this version.
      - name: Install Ruff
        run: pip install ruff==0.16.2

      # From the repo root, not marm-mcp-server. scripts/ and marm-console/tests
      # were never linted by CI, so their result depended on whichever ruff a
      # developer happened to have installed: 0.15.16 called scripts/ clean and
      # 0.16.2 reported 111 findings against the same code. ruff.toml at the root
      # is what all three trees now resolve to.
      - name: Run Ruff Check
        run: ruff check --output-format=github

      - name: Run Ruff Format Check
        run: ruff format --check
