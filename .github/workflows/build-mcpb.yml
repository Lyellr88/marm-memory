name: Build MARM MCPB artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-mcpb.yml"
      - "packaging/mcpb/**"
      - "scripts/build-mcpb.py"
      - "marm-mcp-server/pyproject.toml"
      - "marm-mcp-server/marm_mcp_server/**"
      - "marm-mcp-server/marm_graph/**"
      # The suite this job runs. Without it a change to the MCPB contract
      # checks skips the only job that executes them, so the test guarding the
      # bundle could be edited -- or broken -- with nothing to catch it.
      - "marm-mcp-server/tests/test_mcpb_bundle.py"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Smoke the staged MCPB runtime
        run: uv run --locked --project packaging/mcpb --with pytest pytest -q marm-mcp-server/tests/test_mcpb_bundle.py

      - name: Bundle concept extraction model
        run: python marm-mcp-server/scripts/bundle-concept-model.py

      - name: Build MCPB
        run: python scripts/build-mcpb.py --smoke-stdio

      - name: Verify packed MCPB
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -Path dist/mcpb -Filter *.mcpb -File)
          if ($artifacts.Count -ne 1) {
            throw "Expected one MCPB artifact, found $($artifacts.Count)."
          }
          $npx = Get-Command npx -ErrorAction Stop
          & $npx.Source --yes @anthropic-ai/mcpb@2.1.2 info $artifacts[0].FullName
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Linux MCPB candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: marm-memory-mcpb-linux-candidate
          path: dist/mcpb/*.mcpb
          if-no-files-found: error

  upload:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download validated Linux MCPB
        uses: actions/download-artifact@v4
        with:
          name: marm-memory-mcpb-linux-candidate
          path: dist/mcpb

      - name: Upload canonical MCPB artifact
        uses: actions/upload-artifact@v4
        with:
          name: marm-memory-mcpb
          path: dist/mcpb/*.mcpb
          if-no-files-found: error
