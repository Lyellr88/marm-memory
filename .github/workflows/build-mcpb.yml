name: Build MARM MCPB artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-mcpb.yml"
      - "packaging/mcpb/**"
      - "scripts/build-mcpb.py"
      - "marm-mcp-server/pyproject.toml"
      - "marm-mcp-server/marm_mcp_server/**"
      - "marm-mcp-server/marm_graph/**"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install MCPB test runner
        run: python -m pip install pytest

      - name: Smoke the staged MCPB runtime
        run: python -m pytest -q marm-mcp-server/tests/test_mcpb_bundle.py

      - name: Bundle concept extraction model
        run: python marm-mcp-server/scripts/bundle-concept-model.py

      - name: Build MCPB
        run: python scripts/build-mcpb.py --smoke-stdio

      - name: Verify packed MCPB
        run: npx --yes @anthropic-ai/mcpb@2.1.2 info dist/mcpb/*.mcpb

      - name: Upload MCPB artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: marm-memory-mcpb
          path: dist/mcpb/*.mcpb
          if-no-files-found: error
