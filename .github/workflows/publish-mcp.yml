name: Publish MARM MCP Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bundle concept extraction model
        run: python marm-mcp-server/scripts/bundle-concept-model.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Build bundled Console frontend
        working-directory: marm-console
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ../marm-mcp-server/marm_mcp_server/console/static
          mkdir -p ../marm-mcp-server/marm_mcp_server/console/static
          cp -R artifacts/marm-console/dist/public/. ../marm-mcp-server/marm_mcp_server/console/static/

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('marm-mcp-server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r marm-mcp-server/requirements.txt
          pip install -e './marm-mcp-server' --no-deps
          pip install pytest pytest-asyncio pytest-cov jsonschema requests black isort flake8 mypy ruff

      - name: Validate server.json
        run: |
          cd marm-mcp-server
          python validate_server_json.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds and loads the image locally (no push) so tests/test_docker_*.py's
      # docker-marked tests have something to run against -- without this, their
      # own _image_available() gate always skips them, since this is the only
      # point in the pipeline before publish-docker-server actually builds and
      # pushes the real image. Same tag docker_image's MARM_DOCKER_IMAGE default
      # expects, and the same GHA cache scope publish-docker-server's later
      # build reads from, so that build stays fast instead of starting cold.
      - name: Build Docker image for docker-marked tests
        uses: docker/build-push-action@v5
        with:
          context: marm-mcp-server
          push: false
          load: true
          tags: lyellr88/marm-mcp-server:latest
          cache-from: type=gha,scope=marm-mcp-server
          cache-to: type=gha,scope=marm-mcp-server,mode=max

      - name: Run tests
        working-directory: marm-mcp-server
        # smoke_lifecycle boots a real HTTP runtime and races a stop within a
        # fixed window; it is environment-sensitive and belongs in the local
        # runner, not the publish gate. The wheel smoke below validates the
        # shipped artifact.
        run: python -m pytest tests/ -v -m "not smoke_lifecycle"

      - name: Test server startup
        run: |
          # Test that the server can start up
          cd marm-mcp-server
          timeout 10s python -m marm_mcp_server || echo "Server startup test completed"

  publish-pypi:
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bundle concept extraction model
        run: python marm-mcp-server/scripts/bundle-concept-model.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Build bundled Console frontend
        working-directory: marm-console
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ../marm-mcp-server/marm_mcp_server/console/static
          mkdir -p ../marm-mcp-server/marm_mcp_server/console/static
          cp -R artifacts/marm-console/dist/public/. ../marm-mcp-server/marm_mcp_server/console/static/

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine setuptools wheel

      - name: Build package
        run: python -m build
        working-directory: marm-mcp-server

      - name: Smoke test installed wheel and bundled Console
        run: |
          python -m venv /tmp/marm-wheel-smoke
          /tmp/marm-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/marm-wheel-smoke/bin/pip install marm-mcp-server/dist/*.whl
          /tmp/marm-wheel-smoke/bin/marm-memory --help
          /tmp/marm-wheel-smoke/bin/marm-memory console --help
          /tmp/marm-wheel-smoke/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          from marm_mcp_server.console.app import app

          with TestClient(app) as client:
              response = client.get("/")
              assert response.status_code == 200
              assert "<div id=\"root\">" in response.text
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: marm-mcp-server/dist/
          skip-existing: true

  publish-docker-server:
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bundle concept extraction model
        run: python marm-mcp-server/scripts/bundle-concept-model.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Build bundled Console frontend
        working-directory: marm-console
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ../marm-mcp-server/marm_mcp_server/console/static
          mkdir -p ../marm-mcp-server/marm_mcp_server/console/static
          cp -R artifacts/marm-console/dist/public/. ../marm-mcp-server/marm_mcp_server/console/static/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(grep '^version = ' marm-mcp-server/pyproject.toml | cut -d '"' -f 2)" >> $GITHUB_OUTPUT
          fi

      - name: Build and push MCP server Docker image
        uses: docker/build-push-action@v5
        with:
          context: marm-mcp-server
          push: true
          tags: |
            lyellr88/marm-mcp-server:${{ steps.version.outputs.version }}
            lyellr88/marm-mcp-server:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=marm-mcp-server
          cache-to: type=gha,scope=marm-mcp-server,mode=max

  publish-mcp-registry:
    needs: [validate-and-test, publish-pypi, publish-docker-server]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Set version in server.json
        run: |
          cd marm-mcp-server
          VERSION=$(grep '^version = ' pyproject.toml | cut -d '"' -f 2)
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish server to MCP Registry
        run: |
          cd marm-mcp-server
          ../mcp-publisher publish

  publish-glama:
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bundle concept extraction model
        run: python marm-mcp-server/scripts/bundle-concept-model.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Build bundled Console frontend
        working-directory: marm-console
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf ../marm-mcp-server/marm_mcp_server/console/static
          mkdir -p ../marm-mcp-server/marm_mcp_server/console/static
          cp -R artifacts/marm-console/dist/public/. ../marm-mcp-server/marm_mcp_server/console/static/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Glama image
        uses: docker/build-push-action@v5
        with:
          context: marm-mcp-server
          file: marm-mcp-server/Dockerfile.glama
          push: true
          tags: lyellr88/marm-mcp-server:glama-latest
          platforms: linux/amd64
          cache-from: type=gha,scope=marm-glama
          cache-to: type=gha,scope=marm-glama,mode=max

  notify-success:
    needs: [publish-docker-server, publish-pypi, publish-mcp-registry, publish-glama]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Success notification
        run: |
          echo "MARM MCP Server published successfully!"
          echo "PyPI: https://pypi.org/project/marm-mcp-server/"
          echo "Docker MCP: https://hub.docker.com/r/lyellr88/marm-mcp-server"
          echo "MCP Registry: https://registry.modelcontextprotocol.io/servers/io.github.Lyellr88/marm-mcp-server"
