name: Publish MARM MCP Server

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v2.1, v2.1, etc.
  workflow_dispatch:  # Allow manual triggering

permissions:
  id-token: write  # Required for GitHub OIDC authentication
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r marm-mcp-server/MARMcp-beta/requirements.txt
          pip install pytest pytest-asyncio jsonschema requests

      - name: Validate server.json
        run: |
          cd marm-mcp-server/MARMcp-beta
          python validate_server_json.py

      - name: Run tests
        run: |
          # Run any existing tests
          if [ -d "tests" ]; then
            python -m pytest tests/ -v
          else
            echo "No tests directory found, skipping tests"
          fi

      - name: Test server startup
        run: |
          # Test that the server can start up
          cd marm-mcp-server/MARMcp-beta
          timeout 10s python server.py || echo "Server startup test completed"

  publish-pypi:
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: pypi  # Use GitHub environment for PyPI secrets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          cd marm-mcp-server/MARMcp-beta
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel

      - name: Build package
        run: |
          cd marm-mcp-server/MARMcp-beta
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: marm-mcp-server/MARMcp-beta/dist/

  publish-docker:
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=latest
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: marm-mcp-server/MARMcp-beta
          push: true
          tags: |
            lyellr88/marmcp-beta:${{ steps.version.outputs.version }}
            lyellr88/marmcp-beta:latest
          platforms: linux/amd64,linux/arm64

  publish-mcp-registry:
    needs: [publish-pypi, publish-docker]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MCP Publisher CLI
        run: |
          # Install the MCP publisher CLI
          # Using curl to get the latest release
          curl -L -o mcp-publisher https://github.com/modelcontextprotocol/publisher/releases/latest/download/mcp-publisher-linux-amd64
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login to MCP Registry
        run: |
          # Use GitHub OIDC for authentication
          mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          # Publish the server to the MCP registry
          mcp-publisher publish

      - name: Verify publication
        run: |
          # Wait a moment for registry to update
          sleep 30
          # Verify the server is published
          echo "Server published successfully to MCP Registry!"
          echo "Check: https://registry.modelcontextprotocol.io/servers/io.github.marm-systems/marm-mcp-server"

  notify-success:
    needs: [publish-mcp-registry]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Success notification
        run: |
          echo "🎉 MARM MCP Server published successfully!"
          echo "📦 PyPI: https://pypi.org/project/marm-mcp-server/"
          echo "🐳 Docker: https://hub.docker.com/r/lyellr88/marmcp-beta"
          echo "🔗 MCP Registry: https://registry.modelcontextprotocol.io/servers/io.github.marm-systems/marm-mcp-server"
