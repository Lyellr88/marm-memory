<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a67d8;stop-opacity:1" />
    </linearGradient>
    
    <!-- M letter gradient -->
    <linearGradient id="mGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Memory circuit gradient -->
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:0.6" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner shadow -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offset-blur" operator="in"/>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" 
          stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Glassmorphism rings -->
  <circle cx="256" cy="256" r="200" fill="none" 
          stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="256" cy="256" r="160" fill="none" 
          stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="256" cy="256" r="120" fill="none" 
          stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <!-- Large prominent "M" -->
  <g transform="translate(256, 256)">
    <!-- Main M letter -->
    <path d="M -80 -120 L -80 120 L -40 120 L -40 -40 L 0 60 L 40 -40 L 40 120 L 80 120 L 80 -120 L 40 -120 L 0 -20 L -40 -120 Z" 
          fill="url(#mGradient)" 
          filter="url(#innerShadow)"
          stroke="rgba(255,255,255,0.4)" 
          stroke-width="2"/>
    
    <!-- Memory circuit pattern around M -->
    <g opacity="0.6" filter="url(#glow)">
      <!-- Circuit nodes -->
      <circle cx="-100" cy="-60" r="6" fill="url(#circuitGradient)"/>
      <circle cx="100" cy="-60" r="6" fill="url(#circuitGradient)"/>
      <circle cx="-100" cy="60" r="6" fill="url(#circuitGradient)"/>
      <circle cx="100" cy="60" r="6" fill="url(#circuitGradient)"/>
      <circle cx="0" cy="-140" r="4" fill="url(#circuitGradient)"/>
      <circle cx="0" cy="140" r="4" fill="url(#circuitGradient)"/>
      
      <!-- Circuit connections -->
      <line x1="-100" y1="-60" x2="-80" y2="-80" stroke="url(#circuitGradient)" stroke-width="3" opacity="0.7"/>
      <line x1="100" y1="-60" x2="80" y2="-80" stroke="url(#circuitGradient)" stroke-width="3" opacity="0.7"/>
      <line x1="-100" y1="60" x2="-80" y2="80" stroke="url(#circuitGradient)" stroke-width="3" opacity="0.7"/>
      <line x1="100" y1="60" x2="80" y2="80" stroke="url(#circuitGradient)" stroke-width="3" opacity="0.7"/>
      <line x1="0" y1="-140" x2="0" y2="-120" stroke="url(#circuitGradient)" stroke-width="3" opacity="0.7"/>
      <line x1="0" y1="140" x2="0" y2="120" stroke="url(#circuitGradient)" stroke-width="3" opacity="0.7"/>
      
      <!-- Memory pattern dots -->
      <circle cx="-60" cy="-100" r="3" fill="#4CAF50" opacity="0.4"/>
      <circle cx="60" cy="-100" r="3" fill="#4CAF50" opacity="0.4"/>
      <circle cx="-60" cy="100" r="3" fill="#4CAF50" opacity="0.4"/>
      <circle cx="60" cy="100" r="3" fill="#4CAF50" opacity="0.4"/>
      
      <!-- Connecting lines between dots -->
      <line x1="-60" y1="-100" x2="60" y2="-100" stroke="#4CAF50" stroke-width="1" opacity="0.3"/>
      <line x1="-60" y1="100" x2="60" y2="100" stroke="#4CAF50" stroke-width="1" opacity="0.3"/>
    </g>
  </g>
  
  <!-- Bottom text -->
  <text x="256" y="440" text-anchor="middle" 
        font-family="Arial, sans-serif" font-size="28" font-weight="600" 
        fill="rgba(255,255,255,0.9)" filter="url(#glow)">MARM</text>
        
  <!-- Subtle version -->
  <text x="256" y="470" text-anchor="middle" 
        font-family="Arial, sans-serif" font-size="16" font-weight="normal" 
        fill="rgba(255,255,255,0.6)">Desktop v2.1</text>
</svg>