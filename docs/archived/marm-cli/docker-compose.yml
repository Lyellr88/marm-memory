version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: marm-ollama
    runtime: nvidia  # Use NVIDIA runtime for GPU access
    ports:
      - "11434:11434"
    volumes:
      # Persist models so they don't re-download
      - ollama-models:/root/.ollama
    deploy:
      resources:
        limits:
          # Cap resources to prevent system crashes
          cpus: '6'          # Limit to 6 CPU cores
          memory: 32G        # Increased to 32GB RAM for better GPU offloading
        reservations:
          devices:
            - driver: nvidia
              count: 1        # Use 1 GPU (your RTX 3060)
              capabilities: [gpu]
    restart: "no"  # Don't auto-restart (manual control only)
    environment:
      # GPU configuration
      - OLLAMA_NUM_GPU=1
      - OLLAMA_GPU_LAYERS=99
      # Prevent aggressive memory usage
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m  # Unload model after 5min idle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Prevent shared memory issues - increased for larger models
    shm_size: 8gb

volumes:
  ollama-models:
    driver: local
