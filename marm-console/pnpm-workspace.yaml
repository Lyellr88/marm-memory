minimumReleaseAge: 1440
minimumReleaseAgeExclude: []

packages:
  - artifacts/marm-console

overrides:
  esbuild: 0.28.1
  # Pulled in transitively by vite, so there is no dependency line to bump.
  # <=8.5.17 auto-loads the .map file named by a sourceMappingURL comment and can
  # be walked out of the intended directory (GHSA / Dependabot #11). A range, not
  # a pin, so a later patch cannot silently drop back below the fix.
  postcss: '>=8.5.18'
  # Transitive through postcss, which is itself transitive, so again no
  # dependency line to bump. <3.3.18 loops forever in customAlphabet /
  # customRandom at size 0 (CVE-2026-67213). postcss imports neither, and calls
  # nanoid(6) with a literal size, so this is housekeeping rather than a live
  # exposure. Caret, not '>=' like postcss: nanoid 4 went ESM-only, so '>=' pulls
  # in 6.x and postcss's require('nanoid/non-secure') dies with ERR_REQUIRE_ESM.
  # postcss gets away with '>=' only because it has no major above 8.
  nanoid: ^3.3.18

catalog:
  '@radix-ui/react-dialog': ^1.1.23
  '@radix-ui/react-select': ^2.3.7
  '@radix-ui/react-tabs': ^1.1.21
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.101.4
  '@types/node': ^25.3.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^5.0.4
  clsx: ^2.1.1
  lucide-react: ^1.28.0
  react: 19.2.8
  react-dom: 19.2.8
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.3.3
  vite: ^7.3.2
  wouter: ^3.3.5

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild
