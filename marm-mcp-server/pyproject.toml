[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marm-mcp-server"
version = "2.35.0"
description = "Local-first 3-in-1 AI memory layer & MCP server for Claude Code, Codex, Grok, Gemini, VS Code and Cursor. Fuses session history, codebase indexing & concept graphs in SQLite. Enables zero-cloud, privacy-first context & instant recall also works with multi-agent swarms."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Ryan Lyell", email = "ryanlyell@marmemory.com"}
]
maintainers = [
    {name = "Ryan Lyell", email = "support@marmemory.com"}
]
keywords = ["mcp", "ai", "memory", "claude", "assistant", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "fastapi-mcp>=0.4.0",
    "uvicorn>=0.51.0",
    "pydantic>=2.9.2",
    "fastembed>=0.8.0,<1.0.0",
    "numpy>=2.1.2",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10.4",
    "psutil>=6.1.0",
    "structlog>=24.4.0",
    "httpx>=0.28.1",
    "packaging>=24.0,<27.0",
    "mcp>=1.26.0,<2.0.0",
    "codebase-memory-mcp==0.9.0",
    "spacy>=3.8.0,<3.9.0",
]

[project.urls]
Homepage = "https://marmsystems.com"
Documentation = "https://docs.marmsystems.com"
Repository = "https://github.com/Lyellr88/marm-memory"
"Bug Tracker" = "https://github.com/Lyellr88/marm-memory/issues"
"Docker Hub" = "https://hub.docker.com/r/lyellr88/marm-mcp-server"

[project.scripts]
marm-memory = "marm_mcp_server.cli:main"
marm-mcp-server = "marm_mcp_server.cli:main"
marm-mcp-stdio = "marm_mcp_server.server_stdio:main"

[project.optional-dependencies]
docker-image = []
# Kept so existing ``pip install marm-mcp-server[concepts]`` commands remain
# valid. Concept extraction is now bundled with the base distribution.
concepts = []
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "build>=1.2.2",
    "jsonschema>=4.0.0",
    "requests>=2.31.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=2.3.0",
    "ruff>=0.4.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["marm_mcp_server*", "marm_graph*"]
exclude = ["tests*", "*.tests*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "config/*", "templates/*", "models/en_core_web_sm/**/*", "resources/**/*"]
"marm_mcp_server.console" = ["static/*", "static/**/*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Without this, Pydantic models read as plain classes and every optional field
# looks like a required constructor argument.
plugins = ["pydantic.mypy"]
# core/ is the checked scope; imports out of it are resolved but not reported.
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
tmp_path_retention_policy = "none"
markers = [
    "docker: Docker transport tests skipped by scripts/run-tests.py unless --docker is used",
    "slow_stdio: subprocess-based STDIO transport tests skipped by scripts/run-tests.py --fast",
    "smoke: local command parse, dispatch, and isolated lifecycle smoke tests",
    "smoke_lifecycle: HTTP runtime and managed-key lifecycle smoke tests",
    "smoke_docker: smoke tests that launch a real Docker container (need a daemon)",
    "smoke_destructive: opt-in smoke tests that uninstall/reinstall MARM in a disposable virtual environment",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "RUF"]
ignore = [
    "E501",    # line too long — ruff format handles what it can
    "RUF013",  # implicit Optional — existing signatures, defer to type refactor pass
    "B905",    # zip() without strict= — pre-existing bench/test pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# MCP Server Configuration
[project.entry-points."mcp.servers"]
marm = "server:create_server"
