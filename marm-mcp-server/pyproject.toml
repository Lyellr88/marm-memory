[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marm-mcp-server"
version = "2.39.0"
description = "Local-first 3-in-1 AI memory layer & MCP server for Claude Code, Codex, Grok, Gemini, VS Code and Cursor. Fuses session history, codebase indexing & concept graphs in SQLite. Enables zero-cloud, privacy-first context & instant recall also works with multi-agent swarms."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Ryan Lyell", email = "ryanlyell@marmemory.com"}
]
maintainers = [
    {name = "Ryan Lyell", email = "support@marmemory.com"}
]
keywords = ["mcp", "ai", "memory", "claude", "assistant", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "fastapi-mcp>=0.4.0",
    "uvicorn>=0.51.0",
    "pydantic>=2.9.2",
    "fastembed>=0.8.0,<1.0.0",
    "numpy>=2.1.2",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10.4",
    "psutil>=6.1.0",
    "structlog>=24.4.0",
    "httpx>=0.28.1",
    "packaging>=24.0,<27.0",
    "mcp>=1.26.0,<2.0.0",
    "codebase-memory-mcp==0.10.5",
    "spacy>=3.8.0,<3.9.0",
]

[project.urls]
Homepage = "https://marmsystems.com"
Documentation = "https://docs.marmsystems.com"
Repository = "https://github.com/Lyellr88/marm-memory"
"Bug Tracker" = "https://github.com/Lyellr88/marm-memory/issues"
"Docker Hub" = "https://hub.docker.com/r/lyellr88/marm-mcp-server"

[project.scripts]
marm-memory = "marm_mcp_server.cli:main"
marm-mcp-server = "marm_mcp_server.cli:main"
marm-mcp-stdio = "marm_mcp_server.server_stdio:main"

[project.optional-dependencies]
docker-image = []
# Kept so existing ``pip install marm-mcp-server[concepts]`` commands remain
# valid. Concept extraction is now bundled with the base distribution.
concepts = []
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "build>=1.2.2",
    "jsonschema>=4.0.0",
    "requests>=2.31.0",
    # Pinned, not floored, unlike everything above: these three decide whether
    # a gate passes by absolute output rather than by pass/fail, so a floor lets
    # a developer check against a different checker than CI does. mypy and its
    # stubs set the error count scripts/typecheck.py compares to BASELINE, and
    # ruff promotes rules between minor releases (0.16.2 graduated RUF036 and
    # failed a PR whose code had not changed). Upgrading any of them is a
    # deliberate re-baseline: bump here and in every workflow that pins them.
    "mypy==2.1.0",
    "types-psutil==7.2.2.20260518",
    # ruff owns both lint and format. black/isort/flake8 were removed rather
    # than satisfied: black disagreed with ruff format on 13 files, and flake8
    # only reported E501 against its own 79-char default while this uses 88.
    "ruff==0.16.2",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["marm_mcp_server*", "marm_graph*"]
exclude = ["tests*", "*.tests*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "config/*", "templates/*", "models/en_core_web_sm/**/*", "resources/**/*"]
"marm_mcp_server.console" = ["static/*", "static/**/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Without this, Pydantic models read as plain classes and every optional field
# looks like a required constructor argument.
plugins = ["pydantic.mypy"]
follow_imports = "silent"

# Third-party packages that ship no py.typed marker and have no stubs on PyPI.
# Listed one library at a time on purpose: a global ignore_missing_imports would
# also swallow a mistyped or deleted MARM import, which is the one import error
# worth catching. psutil is deliberately absent, since types-psutil covers it.
[[tool.mypy.overrides]]
module = [
    "codebase_memory_mcp.*",
    "apscheduler.*",
    "fastapi_mcp",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
tmp_path_retention_policy = "none"
markers = [
    "docker: Docker transport tests skipped by scripts/run-tests.py unless --docker is used",
    "slow_stdio: subprocess-based STDIO transport tests skipped by scripts/run-tests.py --fast",
    "smoke: local command parse, dispatch, and isolated lifecycle smoke tests",
    "smoke_lifecycle: HTTP runtime and managed-key lifecycle smoke tests",
    "smoke_docker: smoke tests that launch a real Docker container (need a daemon)",
    "smoke_destructive: opt-in smoke tests that uninstall/reinstall MARM in a disposable virtual environment",
]

[tool.ruff]
# The contract itself lives in the repo root's ruff.toml so that this package,
# scripts/, and marm-console/tests/ cannot drift apart. Kept as an extend rather
# than deleted outright: CI lints from inside this directory, and a pyproject
# with no [tool.ruff] is skipped during config discovery, which makes the
# inherited settings invisible from here.
extend = "../ruff.toml"

# MCP Server Configuration
[project.entry-points."mcp.servers"]
marm = "server:create_server"
