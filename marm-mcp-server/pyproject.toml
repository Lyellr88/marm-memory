[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marm-mcp-server"
version = "2.21.1"
description = "marm-memory is a local-first MCP memory layer with hybrid recall, agent coordination, code intelligence, and persistent project context."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Ryan Lyell", email = "lyell@marmsystems.com"}
]
maintainers = [
    {name = "Ryan Lyell", email = "lyell@marmsystems.com"}
]
keywords = ["mcp", "ai", "memory", "claude", "assistant", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "fastapi-mcp>=0.4.0",
    "uvicorn>=0.51.0",
    "pydantic>=2.9.2",
    "fastembed>=0.8.0,<1.0.0",
    "numpy>=2.1.2",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10.4",
    "psutil>=6.1.0",
    "structlog>=24.4.0",
    "httpx>=0.28.1",
    "packaging>=24.0,<27.0",
    "mcp>=1.26.0,<2.0.0",
    "codebase-memory-mcp==0.8.1",
]

[project.urls]
Homepage = "https://marmsystems.com"
Documentation = "https://docs.marmsystems.com"
Repository = "https://github.com/Lyellr88/marm-memory"
"Bug Tracker" = "https://github.com/Lyellr88/marm-memory/issues"
"Docker Hub" = "https://hub.docker.com/r/lyellr88/marm-mcp-server"

[project.scripts]
marm-mcp-server = "marm_mcp_server.server:main"
marm-mcp-stdio = "marm_mcp_server.server_stdio:main"

[project.optional-dependencies]
docker-image = []
# en_core_web_sm (the model) is not included here -- it's referenced via a
# direct URL, which PyPI rejects on package uploads. Install it separately:
# python -m spacy download en_core_web_sm
concepts = [
    "spacy>=3.8.0,<4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "jsonschema>=4.0.0",
    "requests>=2.31.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["marm_mcp_server*", "marm_graph*", "marm_dashboard*"]
exclude = ["tests*", "*.tests*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "config/*", "templates/*"]
"marm_dashboard" = ["static/**/*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
markers = [
    "docker: Docker transport tests skipped by scripts/run-tests.py unless --docker is used",
    "slow_stdio: subprocess-based STDIO transport tests skipped by scripts/run-tests.py --fast",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "RUF"]
ignore = [
    "E501",    # line too long — ruff format handles what it can
    "RUF013",  # implicit Optional — existing signatures, defer to type refactor pass
    "B905",    # zip() without strict= — pre-existing bench/test pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# MCP Server Configuration
[project.entry-points."mcp.servers"]
marm = "server:create_server"
