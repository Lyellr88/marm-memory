services:
  marm-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: lyellr88/marm-mcp-server:2.47.0
    container_name: marm-mcp-server
    restart: unless-stopped
    
    ports:
      - "8001:8001"
    
    volumes:
      - ~/.marm:/home/marm/.marm
    
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
      - SERVER_VERSION=2.47.0
      
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  marm_data:
    driver: local

networks:
  default:
    name: marm-network
