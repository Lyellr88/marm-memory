services:
  marm-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    # :latest is now the all-in-one image (memory + graph + dashboard, one port).
    # Pin :memory-only instead if you need the pre-unification image shape.
    image: lyellr88/marm-mcp-server:latest
    container_name: marm-mcp-server
    restart: unless-stopped
    
    ports:
      - "8001:8001"
    
    volumes:
      - ~/.marm:/home/marm/.marm
    
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
      - SERVER_VERSION=2.21.0
      
      - SEMANTIC_MODEL=all-MiniLM-L6-v2
      
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    healthcheck:
      # Mirrors the Dockerfile's own HEALTHCHECK -- the final image no longer
      # installs curl (removed to shrink the CBM binary's runtime network
      # surface), so this must use the same pure-Python check, not curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  marm_data:
    driver: local

networks:
  default:
    name: marm-network
